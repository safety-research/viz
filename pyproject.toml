[project]
name = "viz"
version = "0.1.0"
description = "A data visualization library for AI research (white background, Newsreader serif type, gray controls and muted orange, blue, sage, purple and ochre conditions) as a one-call chart library: SVG out, PNG/PDF via headless Chromium"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/viz/fonts/OFL-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0",
    "fonttools>=4.47",
    "playwright>=1.48",
]

[project.scripts]
viz = "viz.cli:main"
vellum = "viz.cli:main"  # the old name

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viz", "src/vellum"]  # vellum: the old name, so older scripts keep importing

# The templates and docs travel with the package, so `viz path` (and the skill) find them after any install.
# An editable install gets a copy too, but `viz path` points at the checkout then, so the copy is never read.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "viz/examples"
"docs/guide.md" = "viz/docs/guide.md"
"docs/reference.md" = "viz/docs/reference.md"
"docs/gallery" = "viz/docs/gallery"
