[project]
name = "vellum"
version = "0.1.0"
description = "House figure style (white background, Newsreader claim titles, DM Sans labels, one blue accent on gray) as a one-call chart library: SVG out, PNG/PDF via headless Chromium"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0",
    "fonttools>=4.47",
    "playwright>=1.48",
]

[project.scripts]
vellum = "vellum.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vellum"]
